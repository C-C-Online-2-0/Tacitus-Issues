name: Close pull requests

on:
  pull_request_target:
    types:
      - opened
      - reopened

permissions:
  pull-requests: write

jobs:
  close-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Close pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr close "$PR_NUMBER" --repo "$REPOSITORY" --comment "Thanks for taking the time to contribute. This repository is an issue tracker only, and Tacitus is closed source, so pull requests cannot be reviewed or merged. Please open an issue to report a bug or suggest an improvement."
