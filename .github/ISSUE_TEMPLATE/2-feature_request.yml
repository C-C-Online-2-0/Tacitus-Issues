name: Feature request
description: Suggest a new feature or an improvement for the Tacitus client.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea. Please search existing issues first, and do not include personal data or security vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the current limitation or what you are trying to do.
      placeholder: When I ..., I can't ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain how you think the feature should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you have tried or considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, examples from other clients, or anything else useful.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been suggested yet.
          required: true
